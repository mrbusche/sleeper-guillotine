name: Update Players Data

on:
  schedule:
    - cron: '0 6 * * 2' # Every Tuesday at 06:00 UTC
  workflow_dispatch: {}

jobs:
  update-players:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Download latest players.json
        run: curl -sS https://api.sleeper.app/v1/players/nfl -o public/players.json

      - name: Prune players
        run: node scripts/prune_players.js

      - name: Create Pull Request
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            BRANCH_NAME="update-players-$(date +%Y%m%d-%H%M%S)"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b $BRANCH_NAME
            git add public/players.json public/players_pruned.json
            git commit -m "chore: update players data"
            git push origin $BRANCH_NAME
            gh pr create --title "chore: update players data" --body "Automated update of players data from Sleeper API" --base main --head $BRANCH_NAME
          fi
        env:
          GH_TOKEN: ${{ github.token }}
