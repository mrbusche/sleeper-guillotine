name: Update Players Data

on:
  schedule:
    - cron: '0 6 * * 2' # Every Tuesday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Prune players
        run: python scripts/prune_players.py

      - name: Create Pull Request
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            BRANCH_NAME="update-players-$(date +%Y%m%d-%H%M%S)"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b $BRANCH_NAME
            git add public/players_pruned.json
            git commit -m "chore: update players data"
            git push origin $BRANCH_NAME
            gh pr create --title "chore: update players data" --body "Automated update of players data from Sleeper API" --base main --head $BRANCH_NAME --reviewer mrbusche
          fi
        env:
          GH_TOKEN: ${{ github.token }}
