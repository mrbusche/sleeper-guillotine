name: Update Players Data

on:
  schedule:
    - cron: '0 6 * * 2' # Every Tuesday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-players:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Download latest players.json
        run: curl -sS https://api.sleeper.app/v1/players/nfl -o public/players.json

      - name: Prune players
        run: node scripts/prune_players.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update players data'
          branch: update-players
          branch-suffix: timestamp
          title: 'chore: update players data'
          body: 'Automated update of players data from Sleeper API'
          add-paths: |
            public/players.json
            public/players_pruned.json
