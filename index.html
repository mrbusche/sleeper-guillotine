<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Sleeper League Viewer</title>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: #09f;
        animation: spin 1s ease infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen text-gray-800 p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
      <header class="mb-6">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Sleeper Guillotine League Viewer</h1>
        <p class="text-lg text-gray-600">Enter your league ID and a week to see all rosters and points.</p>
      </header>

      <div class="bg-white p-6 rounded-lg shadow-md mb-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="md:col-span-2">
            <label for="leagueId" class="block text-sm font-medium text-gray-700 mb-1">League ID</label>
            <input
              type="text"
              id="leagueId"
              value="1256757130514415616"
              class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
            />
          </div>
          <div>
            <label for="week" class="block text-sm font-medium text-gray-700 mb-1">Week</label>
            <input
              type="number"
              id="week"
              value="1"
              min="1"
              max="18"
              class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
            />
          </div>
          <div class="flex items-end">
            <button
              id="fetchButton"
              class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Fetch League Data
            </button>
          </div>
        </div>
      </div>

      <div id="messageArea" class="text-center my-6 hidden">
        <div class="flex justify-center items-center">
          <div class="spinner mr-3"></div>
          <span id="messageText" class="text-lg font-medium text-gray-700">Loading...</span>
        </div>
      </div>

      <div id="leagueInfo" class="mb-6 hidden">
        <h2 id="leagueName" class="text-2xl font-bold"></h2>
        <p id="leagueDetails" class="text-md text-gray-600"></p>
      </div>

      <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <div id="eliminatedSection" class="mt-12 hidden">
        <h2 class="text-2xl font-bold mb-4 border-b pb-2 text-gray-700">Eliminated Teams</h2>
        <div id="eliminatedList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
    </div>

    <script type="module">
      // --- Globals ---
      // Cache for all NFL players data
      let allPlayersData = null;
      let abortController = null; // Controller to cancel pending fetch requests
      const API_BASE = 'https://api.sleeper.app/v1';
      const ESPN_REGULAR_SEASON_TYPE = 2;

      const TEAM_ABBR_SLEEPER_TO_ESPN = {
        JAC: 'JAX',
        WAS: 'WSH',
      };

      const numberFormatter = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });

      function convertTeamAbbr(sleeperAbbr) {
        return TEAM_ABBR_SLEEPER_TO_ESPN[sleeperAbbr] || sleeperAbbr;
      }

      function getCurrentNFLWeek() {
        const today = new Date();
        const seasonStart = new Date(2025, 8, 2);
        const diffTime = Math.abs(today - seasonStart);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const currentWeek = Math.ceil(diffDays / 7);
        return Math.min(Math.max(currentWeek, 1), 18);
      }

      // --- DOM Elements ---
      const leagueIdInput = document.getElementById('leagueId');
      const weekInput = document.getElementById('week');
      const fetchButton = document.getElementById('fetchButton');
      const messageArea = document.getElementById('messageArea');
      const messageText = document.getElementById('messageText');
      const resultsDiv = document.getElementById('results');
      const leagueInfoDiv = document.getElementById('leagueInfo');
      const leagueNameEl = document.getElementById('leagueName');
      const leagueDetailsEl = document.getElementById('leagueDetails');
      const eliminatedSection = document.getElementById('eliminatedSection');
      const eliminatedList = document.getElementById('eliminatedList');

      // --- Event Listeners ---
      document.addEventListener('DOMContentLoaded', () => {
        weekInput.value = getCurrentNFLWeek();

        const urlParams = new URLSearchParams(window.location.search);
        const leagueIdParam = urlParams.get('leagueId');

        if (leagueIdParam) {
          leagueIdInput.value = leagueIdParam;
          handleFetchData();
        }
      });
      fetchButton.addEventListener('click', handleFetchData);

      // --- Main Function ---
      async function handleFetchData() {
        const leagueId = leagueIdInput.value.trim();
        const week = weekInput.value;

        if (!leagueId || !week) {
          showMessage('Please enter both a League ID and a Week.', true);
          return;
        }

        // Update URL with leagueId
        const url = new URL(window.location);
        url.searchParams.set('leagueId', leagueId);
        window.history.pushState({}, '', url);

        // Cancel previous pending requests
        if (abortController) {
          abortController.abort();
        }
        abortController = new AbortController();
        const signal = abortController.signal;

        setLoading(true, 'Fetching league data...');
        clearResults();

        try {
          // 1. Start fetching Players Data (if not cached)
          let playersPromise = null;
          if (!allPlayersData) {
            // We do not attach the abort signal here so the large file fetch persists
            // even if the user cancels the league fetch, ensuring it's available next time.
            const cacheBuster = new Date().toISOString().slice(0, 10);
            playersPromise = fetchData(`players_pruned.json?v=${cacheBuster}`);
          } else {
            playersPromise = Promise.resolve(allPlayersData);
          }

          // 2. Fetch League, Rosters, and Users in Parallel
          setLoading(true, 'Fetching league info...');
          const [leagueData, leagueRosters, leagueUsers] = await Promise.all([
            fetchData(`${API_BASE}/league/${leagueId}`, { signal }),
            fetchData(`${API_BASE}/league/${leagueId}/rosters`, { signal }),
            fetchData(`${API_BASE}/league/${leagueId}/users`, { signal }),
          ]);

          // 3. Fetch Stats, Projections, and Schedule in Parallel
          const season = leagueData.season;
          setLoading(true, `Fetching Week ${week} stats & projections...`);

          const espnScheduleUrl = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=${ESPN_REGULAR_SEASON_TYPE}&week=${week}`;

          const [weeklyStats, weeklyProjections, espnScheduleData, resolvedPlayers] = await Promise.all([
            fetchData(`${API_BASE}/stats/nfl/regular/${season}/${week}`, { signal }),
            fetchData(`${API_BASE}/projections/nfl/regular/${season}/${week}`, { signal }),
            fetchData(espnScheduleUrl, { signal }),
            playersPromise, // Ensure players are loaded before we proceed
          ]);

          // Update global cache
          if (!allPlayersData) allPlayersData = resolvedPlayers;

          // 4. Process Schedule
          const scheduleMap = processSchedule(espnScheduleData);

          // 5. Render
          setLoading(true, 'Rendering...');
          processAndRender(leagueData, leagueRosters, leagueUsers, weeklyStats, weeklyProjections, scheduleMap, allPlayersData, week);
        } catch (error) {
          if (error.name === 'AbortError') {
            console.log('Fetch aborted');
            return;
          }
          console.error('Error fetching league data:', error);
          showMessage(`Error: ${error.message}. Check League ID and console.`, true);
        } finally {
          // Only stop loading if we weren't aborted (meaning a new request hasn't started)
          if (!signal.aborted) {
            setLoading(false);
          }
        }
      }

      async function fetchData(url, options = {}) {
        const response = await fetch(url, options);
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({ message: response.statusText }));
          throw new Error(errorData.message || `Failed to fetch ${url}`);
        }
        return response.json();
      }

      function processSchedule(espnScheduleData) {
        const scheduleMap = {};
        if (!espnScheduleData?.events) return scheduleMap;

        for (const event of espnScheduleData.events) {
          const competition = event.competitions?.[0];
          if (!competition) continue;

          const homeTeam = competition.competitors.find((c) => c.homeAway === 'home');
          const awayTeam = competition.competitors.find((c) => c.homeAway === 'away');

          if (!homeTeam || !awayTeam) continue;

          const homeAbbr = homeTeam.team?.abbreviation;
          const awayAbbr = awayTeam.team?.abbreviation;

          let status = 'pre_game';
          const typeName = competition.status?.type?.name;
          const state = competition.status?.type?.state;

          if (typeName === 'STATUS_IN_PROGRESS' || state === 'in') {
            status = 'inprogress';
          } else if (typeName === 'STATUS_FINAL' || state === 'post') {
            status = 'post_game';
          }

          if (homeAbbr) {
            scheduleMap[homeAbbr] = { status, game_id: event.id, opponent: awayAbbr, isHome: true };
          }
          if (awayAbbr) {
            scheduleMap[awayAbbr] = { status, game_id: event.id, opponent: homeAbbr, isHome: false };
          }
        }
        return scheduleMap;
      }

      function processAndRender(league, rosters, users, stats, projections, scheduleMap, allPlayers, week) {
        leagueNameEl.textContent = league.name;
        leagueDetailsEl.textContent = `${league.season} Season | Week ${week} | ${league.total_rosters} Teams`;
        leagueInfoDiv.classList.remove('hidden');

        const scoringKey = getScoringKey(league.scoring_settings);

        // Modern Object.fromEntries for cleaner map creation
        const userMap = Object.fromEntries(users.map((u) => [u.user_id, u.display_name]));

        const allTeamData = [];
        const eliminatedTeams = [];

        for (const roster of rosters) {
          const { owner_id, roster_id, players, metadata } = roster;

          const userDisplayName = owner_id ? userMap[owner_id] : 'Team Available';
          const teamName = metadata?.team_name || userDisplayName || `Team ${roster_id}`;
          const owner = { ownerName: userDisplayName, teamName };

          if (!players || players.length === 0) {
            eliminatedTeams.push(owner);
            continue;
          }

          const playersInfo = players
            .map((playerId) => {
              const playerDetails = allPlayers[playerId];
              if (!playerDetails) return null;

              const { full_name, first_name, last_name, position, injury_status, team: playerTeam } = playerDetails;
              const playerName = full_name || `${first_name} ${last_name}`;
              const espnTeam = playerTeam ? convertTeamAbbr(playerTeam) : null;
              const gameInfo = scheduleMap[espnTeam] || { status: 'none', opponent: null, isHome: false };

              // Determine Points
              const actualPoints = stats[playerId]?.[scoringKey] ?? 0;
              const projectedPoints = projections[playerId]?.[scoringKey] ?? 0;

              // Logic: Use Project if game hasn't started (or isn't scheduled), otherwise Actual
              let displayPoints = 0;
              let isProjected = false;

              if (gameInfo.status === 'none' || gameInfo.status === 'pre_game') {
                displayPoints = projectedPoints;
                isProjected = true;
              } else {
                displayPoints = actualPoints;
              }

              const opponentDisplay = gameInfo.opponent ? (gameInfo.isHome ? `vs ${gameInfo.opponent}` : `@ ${gameInfo.opponent}`) : 'BYE';

              return {
                playerId,
                name: playerName,
                position,
                playerTeam,
                opponent: opponentDisplay,
                points: displayPoints,
                actualPoints,
                projectedPoints,
                isProjected,
                isStarter: false,
                gameStatus: gameInfo.status,
                injuryStatus: injury_status,
              };
            })
            .filter(Boolean); // Remove nulls

          // Optimal Calculations
          const { totalScore: teamProjectedTotal, optimalStarters, orderedStarters } = calculateOptimalScore(playersInfo, 'points');
          const { totalScore: teamActualTotal } = calculateOptimalScore(playersInfo, 'actualPoints');

          // Mark starters
          playersInfo.forEach((p) => {
            if (optimalStarters.has(p.playerId)) p.isStarter = true;
          });

          // Sort: Starters first, then by points descending.
          // Using modern toSorted to avoid mutating the original arrays if we were reusing them
          const nonStarters = playersInfo.filter((p) => !p.isStarter).toSorted((a, b) => b.points - a.points);
          const sortedPlayersInfo = [...orderedStarters, ...nonStarters];

          allTeamData.push({
            owner,
            teamTotalPoints: teamProjectedTotal,
            teamActualTotal,
            playersInfo: sortedPlayersInfo,
          });
        }

        // Sort teams by Total Points Ascending (Lowest score first for Guillotine)
        allTeamData.sort((a, b) => a.teamTotalPoints - b.teamTotalPoints);

        // Render Active Teams
        const teamCards = allTeamData.map((team) =>
          createTeamCardHTML(team.owner, team.teamTotalPoints, team.teamActualTotal, team.playersInfo),
        );
        // Use replaceChildren for efficient DOM clearing and appending
        resultsDiv.innerHTML = teamCards.join('');

        // Render Eliminated Teams
        if (eliminatedTeams.length > 0) {
          eliminatedSection.classList.remove('hidden');
          const elimCards = eliminatedTeams.toSorted((a, b) => a.teamName.localeCompare(b.teamName)).map(createEliminatedTeamCardHTML);

          eliminatedList.innerHTML = elimCards.join('');
        }
      }

      function calculateOptimalScore(allPlayersOnRoster, scoreKey = 'points') {
        const sortByScore = (a, b) => b[scoreKey] - a[scoreKey];

        // Use toSorted (ES2023) to avoid mutating the filtered arrays
        const qbs = allPlayersOnRoster.filter((p) => p.position === 'QB').toSorted(sortByScore);
        const rbs = allPlayersOnRoster.filter((p) => p.position === 'RB').toSorted(sortByScore);
        const wrs = allPlayersOnRoster.filter((p) => p.position === 'WR').toSorted(sortByScore);
        const tes = allPlayersOnRoster.filter((p) => p.position === 'TE').toSorted(sortByScore);

        let totalScore = 0;
        const optimalStarterIds = new Set();
        const orderedStarters = [];

        const addPlayer = (player) => {
          if (player) {
            optimalStarterIds.add(player.playerId);
            totalScore += player[scoreKey];
            orderedStarters.push(player);
          }
        };

        // Roster Construction: 1 QB, 2 RB, 2 WR, 1 TE, 2 FLEX
        addPlayer(qbs[0]);
        addPlayer(rbs[0]);
        addPlayer(rbs[1]);
        addPlayer(wrs[0]);
        addPlayer(wrs[1]);
        addPlayer(tes[0]);

        // Flex Pool: Remaining RBs, WRs, TEs
        const flexPool = [...rbs, ...wrs, ...tes].filter((p) => !optimalStarterIds.has(p.playerId)).toSorted(sortByScore);

        addPlayer(flexPool[0]);
        addPlayer(flexPool[1]);

        return { totalScore, optimalStarters: optimalStarterIds, orderedStarters };
      }

      // Generate HTML string instead of DOM nodes for performance with innerHTML
      function createTeamCardHTML(owner, totalProjected, totalActual, players) {
        // Check for perfect match (Projected == Actual) with no active games
        const totalsMatch = totalProjected.toFixed(2) === totalActual.toFixed(2);
        const anyGameInProgress = players.some((p) => p.gameStatus === 'inprogress');

        const checkIcon =
          totalsMatch && !anyGameInProgress
            ? `<span class="ml-3 inline-flex items-center text-green-600" title="Finalized">
               <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
                 <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 7.22a.75.75 0 00-1.06-1.06l-4.72 4.72-1.72-1.72a.75.75 0 10-1.06 1.06l2.25 2.25a.75.75 0 001.06 0l5.25-5.25z" clip-rule="evenodd" />
               </svg>
             </span>`
            : '';

        const playersList = players
          .map((p) => {
            const inProgressBadge = p.gameStatus === 'inprogress' ? '🚧' : '';
            const injuryBadge = p.injuryStatus === 'Out' ? '🤕' : '';
            const zeroProjClass = p.projectedPoints === 0 ? 'text-red-600 font-bold' : 'text-gray-500';
            const rowClass = p.isStarter ? 'font-semibold text-gray-900' : 'text-gray-500';
            const scoreClass = p.isStarter ? 'text-black' : 'text-gray-500';

            return `
              <li class="flex justify-between items-center py-2 ${rowClass}">
                <span class="truncate" title="${p.name}">
                  ${p.name} <span class="text-xs uppercase text-gray-400 ml-1">${p.playerTeam || ''} ${p.opponent}</span>
                  <span class="text-xs text-gray-400 ml-1">${p.position}</span>
                  ${inProgressBadge} ${injuryBadge}
                </span>
                <span class="flex-shrink-0 text-right">
                  <span class="${scoreClass}">${numberFormatter.format(p.actualPoints)}</span>
                  <span class="italic font-normal ${zeroProjClass} ml-1">(${numberFormatter.format(p.projectedPoints)})</span>
                </span>
              </li>`;
          })
          .join('');

        return `
          <div class="bg-white shadow-lg rounded-lg p-4 overflow-hidden">
            <div class="border-b border-gray-200 pb-3 mb-3">
              <h3 class="text-xl font-bold truncate" title="${owner.teamName}">${owner.teamName}</h3>
              <div class="mt-2 flex items-center justify-between">
                <div class="flex space-x-6">
                  <div>
                    <p class="text-2xl font-bold text-blue-600">${numberFormatter.format(totalProjected)}</p>
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Projected</p>
                  </div>
                  <div>
                    <p class="text-2xl font-bold text-gray-800">${numberFormatter.format(totalActual)}</p>
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Actual</p>
                  </div>
                </div>
                ${checkIcon}
              </div>
            </div>
            <ul class="divide-y divide-gray-200">${playersList}</ul>
          </div>`;
      }

      function createEliminatedTeamCardHTML(owner) {
        return `
          <div class="bg-white shadow-lg rounded-lg p-4">
            <h3 class="text-xl font-bold truncate text-gray-500" title="${owner.teamName}">${owner.teamName}</h3>
          </div>`;
      }

      function getScoringKey(settings) {
        const rec = settings?.rec ?? 0;
        if (rec === 1) return 'pts_ppr';
        if (rec === 0.5) return 'pts_half_ppr';
        return 'pts_std';
      }

      function setLoading(isLoading, message = 'Loading...') {
        if (isLoading) {
          messageArea.classList.remove('hidden');
          messageText.textContent = message;
          fetchButton.disabled = true;
        } else {
          messageArea.classList.add('hidden');
          fetchButton.disabled = false;
        }
      }

      function showMessage(message, isError = false) {
        messageText.textContent = message;
        messageText.className = isError ? 'text-lg font-medium text-red-600' : 'text-lg font-medium text-gray-700';
        messageArea.classList.remove('hidden');
        messageArea.querySelector('.spinner')?.classList.add('hidden');
      }

      function clearResults() {
        resultsDiv.replaceChildren(); // Modern clear
        eliminatedList.replaceChildren();
        eliminatedSection.classList.add('hidden');
        leagueInfoDiv.classList.add('hidden');
        leagueNameEl.textContent = '';
        leagueDetailsEl.textContent = '';
        messageArea.querySelector('.spinner')?.classList.remove('hidden');
      }
    </script>

    <div class="text-center py-8">
      <a
        href="https://github.com/mrbusche/sleeper-guillotine"
        class="inline-flex items-center text-sm text-gray-600 hover:text-gray-900 transition"
        target="_blank"
      >
        Contribute on GitHub
        <svg class="ml-2 h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
          />
        </svg>
      </a>
    </div>
  </body>
</html>
